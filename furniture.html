    <script>
    // Force furniture filter on page load
    document.addEventListener('DOMContentLoaded', function() {
        // Set filter to furniture
        const event = new CustomEvent('filterchange', { detail: { filter: 'furniture' } });
        document.dispatchEvent(event);
        
        // Trigger the gallery render with furniture filter
        if (typeof renderGallery === 'function') {
            renderGallery('furniture');
        }
    });
    
    // Custom category tracking
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof window.amplitude !== 'undefined') {
            window.amplitude.track('Category Page Viewed', {
                page_type: 'category',
                category: 'furniture',
                page_name: 'Furniture Category'
            });
        }
    });
