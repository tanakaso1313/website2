<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your order from So Tanaka Studio has been canceled. Continue shopping when you're ready.">
    <meta name="robots" content="noindex, nofollow">
    <title>Order Canceled - So Tanaka Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="order-status.css">
</head>
<body>
    <div class="sidebar">
        <header>
             <h1><a href="index.html">S O  T A N A K A</a></h1>
        </header>
        <nav>
            <div class="category-nav">
                <a href="index.html?filter=all" data-filter="all" id="all-link">WORK <span class="toggle-btn" id="toggle-btn">+</span></a>
                <div class="sub-items" id="sub-items">
                    <a href="index.html?filter=furniture" data-filter="furniture">FURNITURE</a>
                    <a href="index.html?filter=light" data-filter="light">LIGHT</a>
                    <a href="index.html?filter=other" data-filter="other">OTHER</a>
                </div>
                <a href="shop.html">SHOP</a>
                <a href="bio.html">BIO</a>
                <a href="archive.html">ARCHIVE</a>
                <a href="contact.html">CONTACT</a>
                <a href="search.html">SEARCH</a>
            </div>
        </nav>
    </div>
    <main class="page-content">
        <p>Your order has been canceled. You can continue shopping when you're ready.</p>
        <a href="shop.html" class="button">Continue Shopping</a>
    </main>
    <div class="legal-policy">
        <a href="legal.html">LEGAL POLICY</a>
    </div>
    <script>
    // Toggle functionality for collapsible navigation
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('toggle-btn');
        const subItems = document.getElementById('sub-items');
        const allLink = document.getElementById('all-link');
        
        if (toggleBtn && subItems) {
            // Restore state from localStorage on page load
            const navExpanded = localStorage.getItem('navExpanded') === 'true';
            if (navExpanded) {
                subItems.classList.add('expanded');
                toggleBtn.textContent = '−';
            }
            
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                subItems.classList.toggle('expanded');
                const isExpanded = subItems.classList.contains('expanded');
                toggleBtn.textContent = isExpanded ? '−' : '+';
                // Save state to localStorage
                localStorage.setItem('navExpanded', isExpanded);
            });
            
            // Prevent the ALL link from navigating when clicking the toggle
            if (allLink) {
                allLink.addEventListener('click', function(e) {
                    // Only allow navigation if NOT clicking the toggle button
                    if (e.target === toggleBtn) {
                        e.preventDefault();
                    }
                });
            }
        }
    });
    </script>
</body>
</html>
