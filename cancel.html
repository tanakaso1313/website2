    <style>
        .add-to-cart {
            background: #000;
            color: #fff;
            border: 1px solid #000;
            padding: 0.5em 2em;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            transition: all 0.2s;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }
        .add-to-cart:hover {
            background-color: transparent;
            color: #000;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <header>
             <h1><a href="/">S O  T A N A K A</a></h1>
        </header>
        <nav>
            <div class="category-nav">
                <a href="/">WORKS</a>
                <a href="/shop">SHOP</a>
                <a href="/bio">BIO</a>
                <a href="/archive">ARCHIVE</a>
                <a href="/contact">CONTACT</a>
            </div>
        </nav>
        <a class="sidebar-social" href="https://www.instagram.com/s_o_tanaka" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" focusable="false">
                <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/>
                <circle cx="12" cy="12" r="4.1"/>
                <circle class="dot" cx="17.1" cy="6.9" r="1.05" fill="currentColor" stroke="none"/>
            </svg>
        </a>
    </div>
    <main class="bio-content">
        <div style="max-width: 50vw;">
        <p>Your order has been canceled. You can continue shopping when you're ready.</p>
        <p>If you have any questions, you're always welcome to reach out. You can find our contact details <a href="/contact" style="text-decoration: underline;">here</a>.</p>
        <p style="margin-top: 2em;"><a href="/shop" class="add-to-cart">Continue shopping</a></p>
            <p style="margin-top: 2em;"><a href="/policies">Shipping, returns &amp; legal notice</a></p>
        </div>
    </main>
    <script>
    // Toggle functionality for collapsible navigation
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('toggle-btn');
        const subItems = document.getElementById('sub-items');
        const allLink = document.getElementById('all-link');
        
        if (toggleBtn && subItems) {
            // Restore state from localStorage on page load
            const navExpanded = localStorage.getItem('navExpanded') === 'true';
            if (navExpanded) {
                subItems.classList.add('expanded');
                toggleBtn.textContent = '−';
            }
            
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                subItems.classList.toggle('expanded');
                const isExpanded = subItems.classList.contains('expanded');
                toggleBtn.textContent = isExpanded ? '−' : '+';
                // Save state to localStorage
                localStorage.setItem('navExpanded', isExpanded);
            });
            
            // Prevent the ALL link from navigating when clicking the toggle
            if (allLink) {
                allLink.addEventListener('click', function(e) {
                    // Only allow navigation if NOT clicking the toggle button
                    if (e.target === toggleBtn) {
                        e.preventDefault();
                    }
                });
            }
        }
    });
    </script>
</body>
</html>
