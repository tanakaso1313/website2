    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SOTANAKA",
      "alternateName": ["So Tanaka", "Soichiro Tanaka", "So Tanaka Design Studio", "Sotanaka", "sotanaka", "SoTanaka"],
      "url": "https://sotanaka.com",
      "logo": "https://sotanaka.com/images/social/homepage-social.jpg",
      "description": "SOTANAKA is a Tokyo-based design studio established in 2020 by Soichiro Tanaka, working across furniture, lighting and objects.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tokyo",
        "addressCountry": "JP"
      },
      "foundingDate": "2020",
      "sameAs": [
        "https://www.instagram.com/s_o_tanaka"
      ],
      "founder": {
        "@type": "Person",
        "name": "Soichiro Tanaka",
        "alternateName": "So Tanaka",
        "jobTitle": "Furniture and Product Designer",
        "worksFor": { "@type": "Organization", "name": "SOTANAKA" },
        "sameAs": [
          "https://www.instagram.com/s_o_tanaka"
        ]
      }
    }
    </script>
    <!-- Defer analytics to unblock rendering -->
    <script defer src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz" crossorigin="anonymous"></script>
    <style>
        /* Landing grid: works newest first. */
        main {
            padding-top: var(--content-top);
            margin-left: max(22vw, 215px);
            padding-right: 5vw;
            padding-left: 0;
            max-width: none;
        }
        /* PROTOTYPE scatter layout */
        .scatter { padding-bottom: 12vw; }
        .band { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 2vw; align-items: start; }
        .band:first-child { margin-top: 0 !important; }
        .work { display: block; }
        .work img { width: 100%; height: auto; display: block; }
        .work-name {
            margin-top: 10px;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: #999;
            opacity: 0;
            transition: opacity .4s ease;
        }
        .work:hover .work-name { opacity: 1; }
        @media (max-width: 768px) {
            main { margin-left: 0; padding: 4vh 5vw 10vh 5vw; }
            .band { grid-template-columns: repeat(6, 1fr); }
            .band .work { grid-column: auto / span 4 !important; }
            .band:nth-child(even) .work { grid-column: 3 / span 4 !important; }
            .band .work + .work { margin-top: 14vw !important; grid-column: 1 / span 4 !important; }
            .work-name { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <header>

                <a href="/transfer" data-work="TRSF">TRSF</a>
            </div>
        </nav>
    </div>
    
    <main>
        <div class="work-grid" id="workGrid"></div>
    </main>
    
    <!-- Legacy ?filter= URLs: the category pages are retired, so send them home. -->
    <script>
    (function handleLegacyFilterRedirect() {
        if (new URLSearchParams(location.search).get('filter')) {
            history.replaceState(null, '', '/');
        }
    })();
    </script>
    
    <script src="works.js"></script>
    <script src="scatter.js"></script>
    <!-- Amplitude Analytics -->
    <script defer src="analytics.js"></script>
    <script>
    // analytics.js is deferred, so it has not run yet while this inline script
    // is being parsed. Wait for DOMContentLoaded, which fires after deferred
    // scripts have executed and defined the helper.
    document.addEventListener('DOMContentLoaded', function() {
        window.trackPageView('Homepage Viewed', {
            page_type: 'homepage',
            page_name: 'SOTANAKA Homepage',
            studio_location: 'Tokyo',
            founding_year: '2020'
        });
    });
    </script>
</body>
