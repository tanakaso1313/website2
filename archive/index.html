    <style>
        /* Archive-specific styles */
        main {
            padding-top: var(--content-top);
            margin-left: var(--content-left);
        }
        
        .archive-section {
            display: flex;
            padding-top: 0;
            margin-bottom: 8em;
        }
        
        .archive-description {
            width: 25vw;
            padding-left: 0;
            padding-right: 5vw;
        }
        
        /* Matches the product-page title treatment. */
        .archive-description h2 {
            font-family: var(--font-sans);
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            margin: 0 0 24px 0;
        }

        /* Same rhythm and text size as the product pages. */
        .archive-meta {
            margin: 0 0 24px 0;
            line-height: 1.6em;
        }
        
        .archive-text {
            margin: 0 0 24px 0;
            line-height: 1.6em;
        }

        .archive-description > br {
            display: none;
        }
        
        .archive-images {
            width: 45vw;
            padding-right: 3vw;
            padding-top: 0;
        }
        
        .archive-images img {
            width: 100%;
            margin-bottom: 2em;
            cursor: pointer;
        }
        
        .exhibition-separator {
            width: 100%;
            height: 1px;
            background-color: #ccc;
            margin: 4em 0;
        }
        
        @media (max-width: 768px) {
            main {
                margin-left: 0;
                padding: 4vh 5vw 10vh 5vw;
            }
            
            .archive-section {
                flex-direction: column;
                padding-top: 0;
                margin-bottom: 3em;
            }
            
            .archive-description,
            .archive-images {
                width: 100%;
                padding-left: 5vw;
                padding-right: 5vw;
                box-sizing: border-box;
            }
            
            .archive-description {
                order: 1;
                width: auto;
            }
            
            .archive-images {
                order: 2;
                width: auto;
            }
            
            .exhibition-separator {
                margin-left: 5vw;
                margin-right: 5vw;
                margin-top: 2em;
                margin-bottom: 2em;
            }
        }

        /* Archive index: the homepage's scrolling column (landing.js), one halftone photo per exhibition. */
        main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
        .column { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16vh; padding: 8vh 0; }
        .plate { display: block; width: 28vw; position: relative; color: #000; text-decoration: none; }
        .plate img { width: 100%; aspect-ratio: 2 / 3; height: auto; display: block; object-fit: cover; }
        .plate img.colour { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.4s ease; }
        .plate.in-colour img.colour { opacity: 1; }
        .plate-name { margin-top: 12px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #000; }
        .plate-meta { margin-top: 6px; font-size: 12px; line-height: 1.5; color: #000; }
        @media (max-width: 768px), (orientation: portrait) and (max-width: 1100px) {
            .column { gap: 12vh; padding: 8vh 0; }
            .plate { width: min(78vw, calc((100vh - 220px) / 1.5)); }
        }
    </style>
    <script src="/config.js"></script>
    <!-- Amplitude Analytics -->

    });
