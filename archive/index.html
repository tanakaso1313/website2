    <style>
        /* Archive-specific styles */
        main {
            padding-top: var(--content-top);
            margin-left: max(22vw, 215px);
        }
        
        .archive-section {
            display: flex;
            padding-top: 0;
            margin-bottom: 8em;
        }
        
        .archive-description {
            width: 25vw;
            padding-left: 0;
            padding-right: 5vw;
        }
        
        /* Matches the product-page title treatment. */
        .archive-description h2 {
            font-family: var(--font-sans);
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            margin: 0 0 24px 0;
        }

        /* Same rhythm and text size as the product pages. */
        .archive-meta {
            margin: 0 0 24px 0;
            line-height: 1.6em;
        }
        
        .archive-text {
            margin: 0 0 24px 0;
            line-height: 1.6em;
        }

        .archive-description > br {
            display: none;
        }
        
        .archive-images {
            width: 45vw;
            padding-right: 3vw;
            padding-top: 0;
        }
        
        .archive-images img {
            width: 100%;
            margin-bottom: 2em;
            cursor: pointer;
        }
        
        .exhibition-separator {
            width: 100%;
            height: 1px;
            background-color: #ccc;
            margin: 4em 0;
        }
        
        @media (max-width: 768px) {
            main {
                margin-left: 0;
                padding: 4vh 5vw 10vh 5vw;
            }
            
            .archive-section {
                flex-direction: column;
                padding-top: 0;
                margin-bottom: 3em;
            }
            
            .archive-description,
            .archive-images {
                width: 100%;
                padding-left: 5vw;
                padding-right: 5vw;
                box-sizing: border-box;
            }
            
            .archive-description {
                order: 1;
                width: auto;
            }
            
            .archive-images {
                order: 2;
                width: auto;
            }
            
            .exhibition-separator {
                margin-left: 5vw;
                margin-right: 5vw;
                margin-top: 2em;
                margin-bottom: 2em;
            }
        }

        /* Archive index: one square per exhibition, grouped by year. */
        .year-block { display: flex; align-items: flex-start; margin-bottom: 5.5em; }
        .year-label {
            flex: 0 0 8em;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.26em;
            padding-top: 0.2em;
        }
        .year-works { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vw 2vw; }

        @media (max-width: 768px) {
            .year-block { flex-direction: column; margin-bottom: 3.5em; }
            /* flex-basis is height once the block stacks, so release it */
            .year-label { flex: none; margin-bottom: 1em; }
            .year-works { grid-template-columns: repeat(2, 1fr); }
        }

        .work { display: block; }
        .work-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #fafafa;
        }
        .work-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1);
            transition: filter 0.25s ease;
        }
        .work:hover .work-thumb img { filter: none; }
        .work-name {
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            /* one square per row on phones */
            .year-works { grid-template-columns: 1fr; width: 100%; }
        }
    </style>
    <script src="/config.js"></script>
    <!-- Amplitude Analytics -->

            });
        }
    });
    </script>
</head>
