    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topImagesContainer = document.querySelector('.top-images');
             fetch('/products.json')
                 .then(response => {
                     if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(products => {
                    products
                        .filter(product => {
                            const status = product.status || 'available';
                            // Show available and sold_out (not discontinued or variants)
                            return status === 'available' || status === 'sold_out';
                        })
                        .forEach(product => {
                        const productItem = document.createElement('div');
                        productItem.classList.add('product-item');
                        
                        // Prepare safe values
                        const displayName = product.id && product.id.startsWith('LO_') ? product.id : product.name;
                        const altText = product.altText || displayName;
                        const originalSrc = product.image;
                        const hoverSrc = product.hoverImage || product.image;
                        
                        // Create elements safely using DOM methods
                        const img = document.createElement('img');
                        img.setAttribute('src', originalSrc);
                        img.setAttribute('alt', altText);
                        img.setAttribute('data-hover-src', hoverSrc);
                        
                        const h3 = document.createElement('h3');
                        h3.textContent = displayName;
                        
                        const p = document.createElement('p');
                        p.textContent = product.price;
                        
                        // Conditionally wrap in link if page exists
                        if (product.page) {
                            const link = document.createElement('a');
                            link.setAttribute('href', product.page);
                            link.appendChild(img);
                            link.appendChild(h3);
                            link.appendChild(p);
                            productItem.appendChild(link);
                        } else {
                            productItem.appendChild(img);
                            productItem.appendChild(h3);
                            productItem.appendChild(p);
                        }
                         
                         // Add hover functionality for image switching
                         productItem.addEventListener('mouseenter', () => {
                             img.src = hoverSrc;
                         });
                         
                         productItem.addEventListener('mouseleave', () => {
                             img.src = originalSrc;
                         });
                         
                     topImagesContainer.appendChild(productItem);
                     });
                })
                .catch(error => {
                    console.error('Error fetching or processing products:', error);
                });
        });
    </script>

    <script>
    // Toggle functionality for collapsible navigation
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('toggle-btn');
        const subItems = document.getElementById('sub-items');
        const allLink = document.getElementById('all-link');
        
        if (toggleBtn && subItems) {
            // Restore state from localStorage on page load
            const navExpanded = localStorage.getItem('navExpanded') === 'true';
            if (navExpanded) {
                subItems.classList.add('expanded');
                toggleBtn.textContent = '−';
            }
            
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                subItems.classList.toggle('expanded');
                const isExpanded = subItems.classList.contains('expanded');
                toggleBtn.textContent = isExpanded ? '−' : '+';
                // Save state to localStorage
                localStorage.setItem('navExpanded', isExpanded);
            });
            
            // Prevent the ALL link from navigating when clicking the toggle
            if (allLink) {
                allLink.addEventListener('click', function(e) {
                    // Only allow navigation if NOT clicking the toggle button
                    if (e.target === toggleBtn) {
                        e.preventDefault();
                    }
                });
            }
        }
    });
    </script>
