<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sotanaka.com/shop">
    <meta property="og:image" content="https://sotanaka.com/images/social/shop-social.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://sotanaka.com/shop">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
    <script src="config.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <!-- Amplitude Analytics -->
    <script defer src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz" crossorigin="anonymous"></script>
    <script defer src="analytics.js"></script>
    <script>
    // Custom shop page tracking
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof window.amplitude !== 'undefined') {
            window.amplitude.track('Shop Page Viewed', {
                page_type: 'shop',
                page_name: 'SOTANAKA Shop',
                shop_type: 'handcrafted_furniture',
                payment_system: 'stripe'
            });
        }
    });
    </script>
</head>
<body>
    <div class="sidebar">
        <header>
            <h1><a href="/">S O  T A N A K A</a></h1>
        </header>
        <nav>
            <div class="category-nav">
                <a href="/">WORKS</a>
                <a href="/shop">SHOP</a>
                <a href="/bio">BIO</a>
                <a href="/archive">ARCHIVE</a>
                <a href="/contact">CONTACT</a>
            </div>
        </nav>
        <a class="sidebar-social" href="https://www.instagram.com/s_o_tanaka" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/>
                <circle cx="12" cy="12" r="4.1"/>
                <circle class="dot" cx="17.1" cy="6.9" r="1.05"/>
            </svg>
        </a>
    </div>
    </div>
    <div class="top-images"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topImagesContainer = document.querySelector('.top-images');
             fetch('/products.json')
                 .then(response => {
                     if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(products => {
                    products
                        .filter(product => {
                            const status = product.status || 'available';
                            // Show available and sold_out (not discontinued or variants)
                            return status === 'available' || status === 'sold_out';
                        })
                        .forEach(product => {
                        const productItem = document.createElement('div');
                        productItem.classList.add('product-item');
                        
                        // Prepare safe values
                        const displayName = product.id && product.id.startsWith('LO_') ? product.id : product.name;
                        const altText = product.altText || displayName;
                        const originalSrc = product.image;
                        const hoverSrc = product.hoverImage || product.image;
                        
                        // Create elements safely using DOM methods
                        const img = document.createElement('img');
                        img.setAttribute('src', originalSrc);
                        img.setAttribute('alt', altText);
                        img.setAttribute('data-hover-src', hoverSrc);
                        
                        const h3 = document.createElement('h3');
                        h3.textContent = displayName;
                        
                        const p = document.createElement('p');
                        p.textContent = product.price;
                        
                        // Conditionally wrap in link if page exists
                        if (product.page) {
                            const link = document.createElement('a');
                            link.setAttribute('href', product.page);
                            link.appendChild(img);
                            link.appendChild(h3);
                            link.appendChild(p);
                            productItem.appendChild(link);
                        } else {
                            productItem.appendChild(img);
                            productItem.appendChild(h3);
                            productItem.appendChild(p);
                        }
                         
                         // Add hover functionality for image switching
                         productItem.addEventListener('mouseenter', () => {
                             img.src = hoverSrc;
                         });
                         
                         productItem.addEventListener('mouseleave', () => {
                             img.src = originalSrc;
                         });
                         
                     topImagesContainer.appendChild(productItem);
                     });
                })
                .catch(error => {
                    console.error('Error fetching or processing products:', error);
                });
        });
    </script>
    <footer>
        <p><a href="/policies">Shipping, returns &amp; legal notice</a></p>
        <p>&copy; 2026 SOTANAKA. All rights reserved.</p>
    </footer>
    <script>
    // Toggle functionality for collapsible navigation
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('toggle-btn');
        const subItems = document.getElementById('sub-items');
        const allLink = document.getElementById('all-link');
        
        if (toggleBtn && subItems) {
            // Restore state from localStorage on page load
            const navExpanded = localStorage.getItem('navExpanded') === 'true';
            if (navExpanded) {
                subItems.classList.add('expanded');
                toggleBtn.textContent = '−';
            }
            
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                subItems.classList.toggle('expanded');
                const isExpanded = subItems.classList.contains('expanded');
                toggleBtn.textContent = isExpanded ? '−' : '+';
                // Save state to localStorage
                localStorage.setItem('navExpanded', isExpanded);
            });
            
            // Prevent the ALL link from navigating when clicking the toggle
            if (allLink) {
                allLink.addEventListener('click', function(e) {
                    // Only allow navigation if NOT clicking the toggle button
                    if (e.target === toggleBtn) {
                        e.preventDefault();
                    }
                });
            }
        }
    });
    </script>
</body>
</html>
