    <!-- Defer analytics to unblock rendering -->
    <script defer src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz" crossorigin="anonymous"></script>
    <style>
        /* Landing grid: works by year, newest first. */
        main {
            padding-top: var(--content-top);
            margin-left: max(22vw, 215px);
            padding-right: 5vw;
            padding-left: 0;
            max-width: none;
        }
        .year-block { display: flex; align-items: flex-start; margin-bottom: 5.5em; }
        .year-label {
            flex: 0 0 8em;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.26em;
            padding-top: 0.2em;
        }
        .year-works { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vw 2vw; }
        .work { display: block; }
        .work-thumb { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #fafafa; }
        .work-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .work-name {
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            main { margin-left: 0; padding: 4vh 5vw 10vh 5vw; }
            .year-block { flex-direction: column; margin-bottom: 3.5em; }
            /* flex-basis is height once the block stacks, so release it */
            .year-label { flex: none; margin-bottom: 1em; }
            .year-works { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            /* one square per row on phones */
            .year-works { grid-template-columns: 1fr; width: 100%; }
        }
    </style>
</head>

    (function handleLegacyFilterRedirect() {
