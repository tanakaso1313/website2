    <style>
        /* Landing grid: works newest first. */
        main {
            padding-top: var(--content-top);
            margin-left: max(22vw, 215px);
            padding-right: 5vw;
            padding-left: 0;
            max-width: none;
        }
        /* Landing: centred column of works that loops endlessly, with a blended midline nav */
        body { background: #fff; }
        main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
        /* even gap all the way, including where the loop joins the last work to the first */
        .column { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16vh; padding: 8vh 0; }
        .plate { display: block; width: 28vw; }
        /* one frame for every photo; 3:4 photos lose a thin slice at the sides */
        .plate img { width: 100%; aspect-ratio: 2 / 3; height: auto; display: block; object-fit: cover; }
        .plate-name { margin-top: 12px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #000; }
        /* NEW tag (works.js isNew): a small outlined label beside the name */
        .plate-new { display: inline-block; margin-left: 8px; padding: 1px 4px 0; border: 1px solid #000;
            font-size: 8px; letter-spacing: 0.16em; line-height: 1.4; vertical-align: 1px; }
        /* Touch screens have no hover: the photo nearest the middle of the screen shows in colour,
           faded in over the halftone (landing.js adds the colour layer and the .in-colour class). */
        .plate { position: relative; }
        .plate img.colour { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.4s ease; }
        .plate.in-colour img.colour { opacity: 1; }

        /* Navigation: fixed lines that invert against whatever passes behind them */
        .midline, .topline {
            position: fixed; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 0 24px; color: #fff; mix-blend-mode: difference; pointer-events: none;
            font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
        }
        .midline { top: 50%; transform: translateY(-50%); }
        /* two groups, so no link sits in the middle where every photo passes */
        .midline .group { display: flex; gap: 5vw; }
        .topline { top: 24px; }
        .topline h1 { margin: 0; font: inherit; letter-spacing: inherit; }
        .midline a, .topline a { color: inherit; text-decoration: none; pointer-events: auto; }
        .midline a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }

        /* Phones and upright tablets: the photo always fills the middle of the screen, so links
           blended over the halftone dots become unreadable. The name and links move to plain white
           bars at the top and bottom, and the photos scroll between them. */
        @media (max-width: 768px), (orientation: portrait) and (max-width: 1100px) {
            .column { gap: 12vh; padding: 8vh 0; }
            /* as wide as a phone allows, but never taller than the space between the bars */
            .plate { width: min(78vw, calc((100vh - 150px) / 1.5)); }
            .midline, .topline {
                mix-blend-mode: normal; color: #000; background: #fff;
                padding: 14px 16px; letter-spacing: 0.12em; font-size: 11px;
            }
            .topline { top: 0; }
            .midline { top: auto; bottom: 0; transform: none; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
            /* one evenly spaced row, the same as the bottom bar on every other page */
            .midline .group { display: contents; }
        }
        /* Scroll hint: thin chevron in the white gap under the first photo's name, gently bobbing;
           gone after the first scroll. */
        .scroll-hint {
            position: absolute; left: 50%; top: calc(100% + 36px); z-index: 2;
            transform: translateX(-50%);
            color: #000; pointer-events: none;
            opacity: 0; transition: opacity 0.6s ease;
        }
        .scroll-hint svg { display: block; animation: hint-bob 1.6s ease-in-out infinite alternate; }
        .scroll-hint.show { opacity: 1; }
        .scroll-hint.gone { opacity: 0; }
        @keyframes hint-bob { from { transform: translateY(0); } to { transform: translateY(5px); } }
        @media (prefers-reduced-motion: reduce) { .scroll-hint svg { animation: none; } }
        @media (max-width: 768px), (orientation: portrait) and (max-width: 1100px) {
            .scroll-hint { top: calc(100% + 22px); }
        }

                <p lang="ja">SOTANAKAは、デザイナー田中聡一朗が2020年に設立した東京を拠点とするデザインスタジオです。家具、照明、オブジェを手がけています。</p>
                <h2>Works</h2>
                <ul>
                <li><a href="/curly">Curly</a> (2026). Curly is a table lamp by SOTANAKA, shaped by the curl that paper keeps from being rolled for storage and transport.</li>
                <li><a href="/uneri">Uneri</a> (2026). Uneri is a furniture collection by SOTANAKA, made from branches pruned from Tokyo's street trees and fallen wood gathered from local parks.</li>
                <li><a href="/mo-lamp">MO Lamp</a> (2025). MO Lamp is a sculptural lighting work by SOTANAKA.</li>
                <li><a href="/let-a-colored-paper-swim-in-clouds">Let a Colored Paper Swim in the Clouds</a> (2025). Let a Colored Paper Swim in the Clouds is a series of works in white cement and colored paper by SOTANAKA.</li>
                <li><a href="/liminal-lamp">Liminal Lamp</a> (2025). Liminal Lamp is a lighting collection by SOTANAKA.</li>
                <li><a href="/liminal-objects">Liminal Objects</a> (2025). Liminal Objects is a series of grid works in MDF and lacquer paint by SOTANAKA.</li>
                <li><a href="/cya">C ya</a> (2025). C ya is a work by SOTANAKA exploring the curved mirror as a Japanese cultural object.</li>
                <li><a href="/memento">Memento</a> (2023). Memento is a functional sculptural form in glazed porcelain by SOTANAKA.</li>
                <li><a href="/vnsh">Vnsh</a> (2023). Vnsh is a lighting work in aluminum, stainless steel, and MDF by SOTANAKA.</li>
                <li><a href="/ori">ORI</a> (2019). ORI is a console in marble and MDF designed by SOTANAKA for Roche Bobois, Paris.</li>
                <li><a href="/lti">Less Than Instrument</a> (2020). Less Than Instrument is a lighting collection in steel and copper by SOTANAKA.</li>
                <li><a href="/transfer">Transfer</a> (2019). Transfer is a series of works in white cement and colored paper by SOTANAKA.</li>
                </ul>

    <script>
    // Show the scroll hint once the column has settled, and remove it at the visitor's first scroll.
    // The column opens by scrolling itself into place, so only movement after that counts.
    window.addEventListener('load', function () {
        var hint = document.querySelector('.scroll-hint');
        if (!hint) return;
        // Sit under the photo nearest the top of the screen (the newest work), in the gap before the next one.
        var first = null, best = Infinity;
        document.querySelectorAll('.plate').forEach(function (p) {
            var d = Math.abs(p.getBoundingClientRect().top);
            if (d < best) { best = d; first = p; }
        });
        if (!first) return;
        var anchor = first.querySelector('.plate-name') || first;
        anchor.style.position = 'relative';
        anchor.appendChild(hint);
        var start = window.scrollY, done = false;
        var hide = function () {
            if (done) return;
            done = true;
            hint.classList.add('gone');
            setTimeout(function () { hint.remove(); }, 700);
        };
        setTimeout(function () { if (!done) hint.classList.add('show'); }, 600);
        window.addEventListener('scroll', function () { if (Math.abs(window.scrollY - start) > 30) hide(); }, { passive: true });
        ['wheel', 'touchmove', 'keydown'].forEach(function (e) { window.addEventListener(e, hide, { passive: true, once: true }); });
    });
    </script>
