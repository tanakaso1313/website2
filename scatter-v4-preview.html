    <style>
        /* Landing grid: works newest first. */
        main {
            padding-top: var(--content-top);
            margin-left: max(22vw, 215px);
            padding-right: 5vw;
            padding-left: 0;
            max-width: none;
        }
        /* PROTOTYPE v4/v5: tall panes */
        .panes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vw; padding-bottom: 10vw; }
        .pane { position: relative; display: block; aspect-ratio: 2 / 3; overflow: hidden; }
        .pane img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .6s ease; }
        .pane-text {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4em;
            text-align: center; padding: 0 1.5em;
            font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
            opacity: 0; transition: opacity .6s ease;
            pointer-events: none;
        }
        .pane-category { font-size: 11px; letter-spacing: 0.24em; text-transform: none; color: #666; }

        /* v4: photo gives way to the title */
        body[data-hover="text"] .pane:hover img,
        body[data-hover="text"] .pane:focus-visible img { opacity: 0; }
        body[data-hover="text"] .pane:hover .pane-text,
        body[data-hover="text"] .pane:focus-visible .pane-text { opacity: 1; }

        /* v5: full-page colour photo behind the grid */
        .backdrop { position: fixed; inset: 0; z-index: 0; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
        .backdrop img { width: 100%; height: 100%; object-fit: cover; display: block; }
        body[data-hover="backdrop"] main { position: relative; z-index: 1; }
        body.backdrop-on .backdrop { opacity: 1; }
        body.backdrop-on .pane img { opacity: 0; }
        body.backdrop-on .pane:hover,
        body.backdrop-on .pane:focus-visible { background: rgba(255, 255, 255, 0.55); }
        body.backdrop-on .pane:hover .pane-text,
        body.backdrop-on .pane:focus-visible .pane-text { opacity: 1; }
        body.backdrop-on .pane-category { color: #222; }

        @media (max-width: 768px) {
            main { margin-left: 0; padding: 4vh 5vw 10vh 5vw; }
            .panes { grid-template-columns: 1fr; gap: 14vw; }
            /* no hover on phones: show the title under the photo instead */
            .pane { aspect-ratio: auto; overflow: visible; }
            .pane img { aspect-ratio: 2 / 3; height: auto; }
            .pane-text { position: static; opacity: 1; flex-direction: row; justify-content: flex-start; gap: 1.2em; padding: 12px 0 0; letter-spacing: 0.2em; }
            .backdrop { display: none; }
        }
    </style>
</head>
